<script>

    let isDarkMode = true;

    function setInitialLightDarkMode() {
        const urlParams = new URLSearchParams(window.location.search);
        let mode = urlParams.get('mode');

        if (mode === null) {
            const cookieMode = getCookie('mode');
            console.log(cookieMode);
            if (cookieMode !== "") {
                mode = cookieMode;
                if (mode === "0") {
                    setLightMode(true);  // Use dark mode if mode is 0
                    isDarkMode = true;   // Update the local variable
                } else {
                    setLightMode(false); // Use light mode if mode is 1
                    isDarkMode = false;  // Update the local variable
                }
            } else {
                const now = new Date();
                const currentHour = now.getHours();

                // Default to dark mode and switch to light mode based on time
                if (currentHour >= 10 && currentHour < 16) {
                    setLightMode(true); // Set to light mode during the day
                    isDarkMode = true;  // Update the local variable
                    mode = '1'; // Update mode
                } else {
                    setLightMode(false);  // Set to dark mode during the night
                    isDarkMode = false;   // Update the local variable
                    mode = '0'; // Update mode
                }
            }
        } else {
            if (mode === "0") {
                setLightMode(true);  // Use dark mode if mode is 0
                isDarkMode = true;   // Update the local variable
            } else {
                setLightMode(false); // Use light mode if mode is 1
                isDarkMode = false;  // Update the local variable
            }
        }
        updateNavigationLinks(!isDarkMode);
    }

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }


    function setLightMode(isDark) {
        if (isDark) {
            $('main > article > section > div:eq(1)').removeClass("dark-bg").addClass("light-bg");

            $("#darkMode").css("filter", "invert(0)");

            if(search.indexOf("shop") > -1) {

        } else {

            $(".dark-text").removeClass("dark-text").addClass("light-text");
            $(".light-bg").removeClass("light-bg").addClass("dark-bg");

            $(".dark-border-top").removeClass("dark-border-top").addClass("light-border-top");
            $(".dark-border-bottom").removeClass("dark-border-bottom").addClass("light-border-bottom");
            let search = window.location.href;
            if(search.indexOf("shop") > -1) {
                $(".content-wrapper").css("filter","invert(0)");
                $(".content-wrapper").css("background-color","#000000");
                $('a[href="https://www.niftygateway.com/collections/touchgrass/"]').css("color","#007bff");

                $(".sqs-add-to-cart-button.sqs-suppress-edit-mode.sqs-button-element--primary").css("background-color","#007bff");
            }

            $(".floating-cart").css("filter","invert(1)");

            $("#darkMode").css("filter", "invert(1)");
        }
        $("#toggleDarkLight").blur();
    }

    function toggleLightDark() {
        if (isDarkMode) {
            setLightMode(false);
            updateNavigationLinks(isDarkMode);
        } else {
            setLightMode(true);
            updateNavigationLinks(isDarkMode);
        }
        isDarkMode = !isDarkMode; // Toggle the local variable
    }

    $(document).ready(function() {
        setInitialLightDarkMode();
        $("#toggleDarkLight").on("click", function() {
            toggleLightDark();
        });
    });

    function updateNavigationLinks(isDark) {
        const mode = isDark ? '1' : '0'; // 0 for dark mode, 1 for light mode
        document.querySelectorAll('.nav-link-2').forEach(function(link) {
            const href = link.getAttribute('href').split('?')[0]; // Get the base URL without any existing query parameters
            const newHref = `${href}?mode=${mode}`; // Create the new href with the mode query parameter
            link.setAttribute('href', newHref); // Update the href attribute with the mode query parameter
        });
        const baseUrl = window.location.href.split('?')[0]; // Get the base URL without any existing query parameters
        const newUrl = `${baseUrl}?mode=${mode}`; // Construct the new URL with the mode query parameter
        history.replaceState({}, document.title, newUrl); // Replace the URL in the browser without reloading the page

        // Update the cookies with the mode
        document.cookie = `mode=${mode}; expires=Fri, 31 Dec 9999 23:59:59 GMT; path=/`;
    }

            }

        adjustFooterTextSize();

        // Call the function when the window is resized

            adjustFooterTextSize();
        });
    });</script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Define all available images - 20 background images
        const allImages = [
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/1.jpg", alt: "Background 1" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/2.jpg", alt: "Background 2" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/3.jpg", alt: "Background 3" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/4.jpg", alt: "Background 4" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/5.jpg", alt: "Background 5" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/6.jpg", alt: "Background 6" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/7.jpg", alt: "Background 7" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/8.jpg", alt: "Background 8" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/9.jpg", alt: "Background 9" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/10.jpg", alt: "Background 10" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/11.jpg", alt: "Background 11" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/12.jpg", alt: "Background 12" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/13.jpg", alt: "Background 13" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/14.jpg", alt: "Background 14" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/15.jpg", alt: "Background 15" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/16.jpg", alt: "Background 16" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/17.jpg", alt: "Background 17" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/18.jpg", alt: "Background 18" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/19.jpg", alt: "Background 19" },
            { src: "https://andrewmitchell-art.xyz/images/backgrounds/20.jpg", alt: "Background 20" }
        ];

        // Randomly select 3 images
        function getRandomImages(arr, count) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        // ── HERO MODE ──────────────────────────────────────────────────
        // true  → desktop shows the single hero image, mobile shows random carousel
        // false → both desktop and mobile show the random carousel (original behaviour)
        const USE_DESKTOP_HERO = true;
        // ───────────────────────────────────────────────────────────────

        const DESKTOP_HERO = { src: "https://andrewmitchell-art.xyz/images/hero/MUGEN%20-%202026-05-01T023010.017.jpg", alt: "Hero" };

        const isDesktop = window.innerWidth >= 769;
        const selectedImages = (USE_DESKTOP_HERO && isDesktop)
            ? [DESKTOP_HERO]
            : getRandomImages(allImages, 3);

        // Inject the selected images into the carousel
        const carouselContainer = document.getElementById('homepage-carousel');
        selectedImages.forEach((img, index) => {
            const imgElement = document.createElement('img');
            imgElement.classList.add('carousel-image');
            if (index === 0) {
                imgElement.classList.add('active');
                imgElement.classList.add('initial-fade'); // Add fade-in animation for first image
            }
            imgElement.src = img.src;
            imgElement.alt = img.alt;
            carouselContainer.appendChild(imgElement);
        });

        // Initialize carousel
        const carouselImages = document.querySelectorAll('.carousel-image');
        const indicatorsContainer = document.getElementById('carousel-indicators');
        let currentIndex = 0;
        let autoPlayInterval;

        // Create indicators
        carouselImages.forEach((img, index) => {
            const indicator = document.createElement('button');
            indicator.classList.add('carousel-indicator');
            if (index === 0) indicator.classList.add('active');
            indicator.setAttribute('aria-label', `Go to image ${index + 1}`);
            indicator.addEventListener('click', () => goToSlide(index));
            indicatorsContainer.appendChild(indicator);
        });

        const indicators = document.querySelectorAll('.carousel-indicator');

        // Hide indicators when there's only one image
        if (selectedImages.length <= 1) {
            indicatorsContainer.style.display = 'none';
        }

        function goToSlide(index) {
            // Remove active class from current image and indicator
            carouselImages[currentIndex].classList.remove('active');
            indicators[currentIndex].classList.remove('active');

            // Add active class to new image and indicator
            currentIndex = index;
            carouselImages[currentIndex].classList.add('active');
            indicators[currentIndex].classList.add('active');

            // Reset auto-play
            resetAutoPlay();
        }

        function nextSlide() {
            const nextIndex = (currentIndex + 1) % carouselImages.length;
            goToSlide(nextIndex);
        }

        function prevSlide() {
            const prevIndex = (currentIndex - 1 + carouselImages.length) % carouselImages.length;
            goToSlide(prevIndex);
        }

        function startAutoPlay() {
            autoPlayInterval = setInterval(nextSlide, 15000); // Change image every 15 seconds (super slow)
        }

        function resetAutoPlay() {
            clearInterval(autoPlayInterval);
            startAutoPlay();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'ArrowRight') nextSlide();
        });

        // Touch/swipe support
        let touchStartX = 0;
        let touchEndX = 0;

        const carousel = document.getElementById('homepage-carousel');
        carousel.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        carousel.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) nextSlide(); // Swipe left
            if (touchEndX > touchStartX + 50) prevSlide(); // Swipe right
        }

        // Start auto-play
        startAutoPlay();

        let search = window.location.href;
        if(search.indexOf("/cart") > -1) {
            $(".container").addClass("light-text");
        }
        $(".nested-category-tree-wrapper").hide();
        const images = document.querySelectorAll('img');
        images.forEach(img => {
            const src = img.getAttribute('data-src');
            if (src) {
                img.setAttribute('src', src);
                img.removeAttribute('data-src');
            }
        });
        var l = window.location.href;
        if(l.indexOf("commerce/orders/") > -1) {
            $("#nav").hide();
            $("#footer").hide();
        }
        var currentPath = window.location.pathname.toLowerCase();
        if(currentPath.indexOf("shop") > -1 || currentPath.indexOf("commerce") > -1){
            document.title = "Andrew Mitchell - Shop";

            $(document).ready(function() {
                $("a.nav-item.nav-link:contains('SHOP')").css("text-decoration", "underline");
            });
        }
    });
</script>
