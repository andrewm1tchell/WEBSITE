<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Mitchell - Collections</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        :root {
            --bg: #fafafa;
            --text: #1a1a1a;
            --text-secondary: #666;
            --text-tertiary: #888;
            --text-muted: #999;
            --card-bg: #fff;
            --card-border: #eee;
            --card-hover-border: #999;
            --card-shadow: rgba(0,0,0,0.08);
            --nav-bg: rgba(255,255,255,0.95);
            --nav-shadow: rgba(0,0,0,0.1);
            --nav-text: #666;
            --nav-hover-text: #333;
            --nav-hover-bg: #fff;
            --sub-bg: #f8f8f8;
            --sub-hover-bg: #f0f0f0;
            --nested-bg: #f0f0f0;
            --nested-hover-bg: #e8e8e8;
            --nested-border: #e0e0e0;
            --nested-text: #555;
            --border-color: #eee;
            --link-border: #ccc;
        }

        body.dark {
            --bg: #141414;
            --text: #e0e0e0;
            --text-secondary: #999;
            --text-tertiary: #777;
            --text-muted: #666;
            --card-bg: #1e1e1e;
            --card-border: #333;
            --card-hover-border: #666;
            --card-shadow: rgba(0,0,0,0.3);
            --nav-bg: rgba(30,30,30,0.95);
            --nav-shadow: rgba(0,0,0,0.3);
            --nav-text: #999;
            --nav-hover-text: #e0e0e0;
            --nav-hover-bg: #2a2a2a;
            --sub-bg: #252525;
            --sub-hover-bg: #2a2a2a;
            --nested-bg: #2a2a2a;
            --nested-hover-bg: #333;
            --nested-border: #444;
            --nested-text: #aaa;
            --border-color: #333;
            --link-border: #555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            padding: 40px 20px;
            padding-top: 60px;
            color: var(--text);
            min-height: 100vh;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .top-nav {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-nav-links {
            display: flex;
            gap: 8px;
        }

        .top-nav a, .top-nav button {
            font-size: 0.85em;
            color: var(--nav-text);
            text-decoration: none;
            background: var(--nav-bg);
            padding: 6px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 3px var(--nav-shadow);
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .top-nav a:hover, .top-nav button:hover {
            color: var(--nav-hover-text);
            background: var(--nav-hover-bg);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8em;
            font-weight: 500;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 0.95em;
        }

        .collections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .collection-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }

        .collection-card:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 2px 8px var(--card-shadow);
        }

        .collection-name {
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .collection-meta {
            font-size: 0.85em;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .collection-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chain-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .chain-ethereum { background: #627eea20; color: #627eea; }
        .chain-arbitrum { background: #28a0f020; color: #28a0f0; }
        .chain-tezos { background: #2c7df720; color: #2c7df7; }

        .collab-badge {
            font-size: 0.8em;
            color: var(--text-tertiary);
            font-style: italic;
        }

        .sub-collections {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--card-border);
        }

        .sub-collection-toggle {
            font-size: 0.7em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
        }

        .sub-collection-toggle:hover {
            color: var(--nav-hover-text);
        }

        .sub-collection-toggle .arrow {
            transition: transform 0.2s ease;
            font-size: 0.8em;
        }

        .sub-collection-toggle.open .arrow {
            transform: rotate(90deg);
        }

        .sub-collection-content {
            display: none;
            margin-top: 6px;
        }

        .sub-collection-content.open {
            display: block;
        }

        .sub-collection-label {
            font-size: 0.7em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .sub-collection-item {
            display: block;
            padding: 5px 10px;
            margin: 3px 0;
            background: var(--sub-bg);
            border-radius: 4px;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s ease;
        }

        .sub-collection-item:hover {
            background: var(--sub-hover-bg);
        }

        .sub-collection-name {
            font-size: 0.8em;
            font-weight: 500;
            color: var(--text);
            display: inline;
        }

        .sub-collection-meta {
            font-size: 0.7em;
            color: var(--text-tertiary);
            display: inline;
            margin-left: 6px;
        }

        .sub-collection-item-wrapper {
            margin-bottom: 2px;
        }

        .nested-subs {
            margin-left: 12px;
            margin-top: 2px;
            padding-left: 6px;
            border-left: 2px solid var(--nested-border);
        }

        .nested-sub-item {
            display: block;
            padding: 4px 8px;
            margin: 2px 0;
            background: var(--nested-bg);
            border-radius: 3px;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s ease;
        }

        .nested-sub-item:hover {
            background: var(--nested-hover-bg);
        }

        .nested-sub-name {
            font-size: 0.75em;
            font-weight: 500;
            color: var(--nested-text);
            display: inline;
        }

        .nested-sub-meta {
            font-size: 0.65em;
            color: var(--text-muted);
            display: inline;
            margin-left: 5px;
        }

        .nested-sub-wrapper {
            margin-bottom: 1px;
        }

        .back-link {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .back-link a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.9em;
            padding-bottom: 2px;
            border-bottom: 1px solid var(--link-border);
        }

        .back-link a:hover {
            border-color: var(--text);
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
        }

        @media (max-width: 600px) {
            .collections-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5em;
            }
        }
    </style>
    <script>
        // Apply theme before render to prevent flash
        (function() {
            var params = new URLSearchParams(window.location.search);
            var mode = params.get('mode');
            if (mode === '1') document.documentElement.classList.add('dark-pending');
        })();
    </script>
</head>
<body>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var mode = params.get('mode');
            if (mode === '1') document.body.classList.add('dark');
        })();
    </script>
    <div class="top-nav">
        <div class="top-nav-links">
            <a href="/art.php" id="topNavBackLink" onclick="var w=window.open('','artsite');try{if(w.location.href!=='about:blank'){w.focus();return false;}}catch(e){w.focus();return false;}return true;">← Back to Site</a>
        </div>
        <button onclick="toggleTheme()" id="themeToggle" title="Toggle dark/light mode" style="background:none !important; box-shadow:none !important; border:none; padding:6px; display:flex; align-items:center; justify-content:center; cursor:pointer;"><img id="darkModeIcon" height="16" width="16" style="filter:invert(0)" src="https://andrewmitchell-art.xyz/images/dark-icon.png" alt="Light Dark Toggle"/></button>
    </div>

    <div class="container">
        <h1>Catalog</h1>

        <div class="collections-grid" id="collectionsGrid">
            <div class="loading">Loading collections...</div>
        </div>

        <div class="back-link">
            <a href="/art.php" id="backLink" onclick="var w=window.open('','artsite');try{if(w.location.href!=='about:blank'){w.focus();return false;}}catch(e){w.focus();return false;}return true;"><- Back to Site</a>
        </div>
    </div>

    <script>
        async function loadCollections() {
            try {
                const response = await fetch('/collections/config.json');
                const data = await response.json();

                const grid = document.getElementById('collectionsGrid');
                grid.innerHTML = '';

                // Create a map of all collections by id
                const collectionMap = {};
                data.collections.forEach(c => collectionMap[c.id] = c);

                // Create a map of parent -> direct sub-collections
                const subCollectionMap = {};
                data.collections.forEach(c => {
                    if (c.parentCollection) {
                        if (!subCollectionMap[c.parentCollection]) {
                            subCollectionMap[c.parentCollection] = [];
                        }
                        subCollectionMap[c.parentCollection].push(c);
                    }
                });

                // Find root collections (no parent, and not a child of another child)
                const rootCollections = data.collections.filter(c => {
                    if (c.parentCollection) return false;
                    return true;
                });

                // Helper function to render nested sub-collections
                function renderSubCollections(parentId, level = 0) {
                    const subs = subCollectionMap[parentId] || [];
                    if (subs.length === 0) return '';

                    const subItems = subs.map(sub => {
                        const nestedSubs = renderSubCollections(sub.id, level + 1);

                        if (level === 0) {
                            // First level sub-collections
                            return `
                                <div class="sub-collection-item-wrapper">
                                    <a href="/collections/${sub.id}/" class="sub-collection-item">
                                        <div class="sub-collection-name">${sub.name}</div>
                                        <div class="sub-collection-meta">${sub.supply} pieces • ${sub.year}</div>
                                    </a>
                                    ${nestedSubs}
                                </div>
                            `;
                        } else {
                            // Nested sub-collections (level 2+)
                            return `
                                <div class="nested-sub-wrapper">
                                    <a href="/collections/${sub.id}/" class="nested-sub-item">
                                        <div class="nested-sub-name">${sub.name}</div>
                                        <div class="nested-sub-meta">${sub.supply} pieces • ${sub.year}</div>
                                    </a>
                                    ${nestedSubs}
                                </div>
                            `;
                        }
                    }).join('');

                    if (level === 0) {
                        const toggleId = 'toggle-' + parentId;
                        return `
                            <div class="sub-collections">
                                <div class="sub-collection-toggle" onclick="toggleSubCollections('${toggleId}', this)">
                                    <span class="arrow">▶</span>
                                    <span>Related Collections (${subs.length})</span>
                                </div>
                                <div class="sub-collection-content" id="${toggleId}">
                                    ${subItems}
                                </div>
                            </div>
                        `;
                    } else {
                        return `<div class="nested-subs">${subItems}</div>`;
                    }
                }

                // Use the order from config.json (don't sort)
                const sorted = rootCollections;

                sorted.forEach(collection => {
                    const card = document.createElement('div');
                    card.className = 'collection-card';

                    const chainClass = `chain-${collection.chain}`;
                    const collabText = collection.collaboration ?
                        `<span class="collab-badge">w/ ${collection.collaboration}</span>` : '';

                    const subHtml = renderSubCollections(collection.id);

                    card.innerHTML = `
                        <a href="/collections/${collection.id}/" style="text-decoration: none; color: inherit;">
                            <div class="collection-name">${collection.name}</div>
                            <div class="collection-meta">
                                <span class="chain-badge ${chainClass}">${collection.chain}</span>
                                <span>${collection.supply} pieces</span>
                                <span>${collection.year}</span>
                                ${collabText}
                            </div>
                        </a>
                        ${subHtml}
                    `;

                    grid.appendChild(card);
                });
                // Update collection links with mode parameter after rendering
                updateLinksWithMode();
            } catch (error) {
                console.error('Error loading collections:', error);
                document.getElementById('collectionsGrid').innerHTML =
                    '<div class="loading">Error loading collections</div>';
            }
        }

        function toggleSubCollections(id, toggleElement) {
            const content = document.getElementById(id);
            if (content) {
                content.classList.toggle('open');
                toggleElement.classList.toggle('open');
            }
        }

        loadCollections();

        // Theme
        function toggleTheme() {
            var isDark = document.body.classList.toggle('dark');
            var icon = document.getElementById('darkModeIcon');
            if (icon) icon.style.filter = isDark ? 'invert(1)' : 'invert(0)';
            var params = new URLSearchParams(window.location.search);
            params.set('mode', isDark ? '0' : '1');
            window.history.replaceState({}, '', window.location.pathname + '?' + params.toString());
            updateLinksWithMode();
        }
        function initTheme() {
            var params = new URLSearchParams(window.location.search);
            var mode = params.get('mode');
            var isDark = mode === '1';
            if (isDark) {
                document.body.classList.add('dark');
            }
            var icon = document.getElementById('darkModeIcon');
            if (icon) icon.style.filter = isDark ? 'invert(1)' : 'invert(0)';
            updateLinksWithMode();
        }
        function updateLinksWithMode() {
            var params = new URLSearchParams(window.location.search);
            var mode = params.get('mode');
            // Update art.php links
            var backLink = document.getElementById('backLink');
            var topNavBackLink = document.getElementById('topNavBackLink');
            var artHref = '/art.php' + (mode ? '?mode=' + mode : '');
            if (backLink) backLink.href = artHref;
            if (topNavBackLink) topNavBackLink.href = artHref;
            // Update collection links
            document.querySelectorAll('.collection-card a[href^="/collections/"]').forEach(function(link) {
                var href = link.getAttribute('href');
                if (mode && href) {
                    link.href = href + (href.includes('?') ? '&' : '?') + 'mode=' + mode;
                }
            });
        }
        initTheme();
    </script>
</body>
</html>
