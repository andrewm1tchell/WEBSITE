<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokori Token List</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fafafa;
            padding: 40px 20px;
            color: #1a1a1a;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5em;
            font-weight: 500;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .token-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .token-list li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .token-list a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 500;
        }

        .token-list a:hover {
            color: #666;
        }

        .owner {
            color: #888;
            font-size: 0.85em;
            font-family: monospace;
        }

        .loading-row {
            color: #aaa;
            font-style: italic;
        }

        .back-link {
            text-align: center;
            margin-top: 40px;
        }

        .back-link a {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 0.9em;
            border-bottom: 1px solid #ccc;
            padding-bottom: 2px;
        }

        .back-link a:hover {
            border-color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nokori Tokens</h1>
        <p class="subtitle">All 400 tokens</p>

        <ul class="token-list" id="tokenList"></ul>

        <div class="back-link">
            <a href="mint.html">← Back to Mint</a>
        </div>
    </div>

    <script>
        const MANIFOLD_CREATOR = "0xF12A9C99f73ca203ec3B956E479a9E8F615C8e5F";
        const RPC_URL = "https://mainnet.infura.io/v3/7c722c5d30fb4872879a308ddecf01cd";
        const MANIFOLD_ABI = ["function ownerOf(uint256 tokenId) view returns (address)"];

        const tokenList = document.getElementById('tokenList');
        const provider = new ethers.JsonRpcProvider(RPC_URL);
        const contract = new ethers.Contract(MANIFOLD_CREATOR, MANIFOLD_ABI, provider);

        // Create all rows first
        for (let i = 1; i <= 400; i++) {
            const li = document.createElement('li');
            li.id = `token-${i}`;
            li.innerHTML = `
                <a href="https://andrewmitchell-art.xyz/art/nokori/${i}.html" target="_blank">#${i}</a>
                <span class="owner loading-row">loading...</span>
            `;
            tokenList.appendChild(li);
        }

        // Fetch owners in batches
        async function fetchOwners() {
            for (let i = 1; i <= 400; i++) {
                try {
                    const owner = await contract.ownerOf(i);
                    const shortOwner = `${owner.slice(0, 6)}...${owner.slice(-4)}`;
                    const ownerSpan = document.querySelector(`#token-${i} .owner`);
                    if (ownerSpan) {
                        ownerSpan.textContent = shortOwner;
                        ownerSpan.className = 'owner';
                    }
                } catch (e) {
                    const ownerSpan = document.querySelector(`#token-${i} .owner`);
                    if (ownerSpan) {
                        ownerSpan.textContent = 'not minted';
                        ownerSpan.className = 'owner';
                    }
                }
            }
        }

        fetchOwners();
    </script>
</body>
</html>
