        body {
            margin: 0;
            padding: 0;ji
            overflow: hidden;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            /* The page never scrolls or zooms under a drag; the drag is the
               piece's own scroll (goat_meadow.js). */
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            /* The visible height on a phone, under its address bar. */
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            /* !important: p5 writes the canvas's pixel size as inline width and
               height, which would otherwise beat these and let the two be
               capped separately — stretching the 4:3 frame. */
            width: min(85vw, calc(85vh * 4 / 3)) !important;
            width: min(85vw, calc(85dvh * 4 / 3)) !important;
            height: auto !important;
            aspect-ratio: 4 / 3;
        }

// Pose lookup
const GOAT_POSES = {
    standing: GOAT_STROKES,
    eating:   GOAT_STROKES_EATING,
};

// Center of mass of all anchors (for centering the goat in its bbox)
function _computeGoatCenter(strokes) {
    let sx = 0, sy = 0, n = 0;
    for (const s of strokes) {
        for (const p of s.pts) {
            if (p.t === 'a') { sx += p.x; sy += p.y; n++; }
        }
    }

// ---------------------------------------------------------------------------
// Scrolling. One scroll position, 0 at the top, 1 all the way down, drives the

// the hill on the right, the moon rises on the left, day crossfades to night,

// times the jitter, so scaling it moves every piece straight home and changes

// landscapes are each rendered once, textures and grain included, and split
// into a sky layer and a ground layer; the sun and moon are pre-grained

	applyTexture();
	yield;
	applyTexture2();
	yield;
	applyGrain();
	colorMode(HSL, 360, 100, 100, 1);

	const src = drawingContext.canvas;
	const d = src.width / width;
	const full = document.createElement('canvas');
	full.width = src.width; full.height = src.height;

// ---------------------------------------------------------------------------
// The sun and moon (makeSkyBody): flat discs, their edges a little out of

// painted by hand rather than drawn with a compass. Each on its own stream,
// so they move nothing else; ?sun=0 leaves both out.
//
// The sun sits on the right and the moon on the left. Each is a sprite of its

// Colour and size come from each palette's `sun` (the night one is the moon).

function makeSkyBody(kind, room) {
	const r = new FinishRng(sceneSeed * 131 + (kind === 'sun' ? 7 : 911));

	const waves = r.int(2, 3);

	const d = drawingContext.canvas.width / width;

	const g = sprite.getContext('2d');

			+ SUN.wobble * Math.sin(a * waves + ph1)
			+ SUN.wobble * 0.4 * Math.sin(a * 7 + ph2));

	g.fill();

		if (!img.data[i + 3]) continue;
		const n = r.decimal(-grainAmt, grainAmt);
		img.data[i] = constrain(img.data[i] + n, 0, 255);
		img.data[i + 1] = constrain(img.data[i + 1] + n, 0, 255);
		img.data[i + 2] = constrain(img.data[i + 2] + n, 0, 255);

		x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));

		c.width = x1 - x0; c.height = y1 - y0;
		c.getContext('2d').drawImage(src, x0, y0, c.width, c.height, 0, 0, c.width, c.height);

				ys.push(m.b * px + m.d * py + m.f);

			const part = copy(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
			if (part) {

				part.oy = m.b * off.x + m.d * off.y;

// The herd as one transparent layer (and a night-tinted copy) at `apart`,
// rebuilt only when that has moved since last time.
const goatCanvas = { day: null, night: null, key: null };

function goatLayersFor(apart) {
	const key = apart.toFixed(3);
	const src = drawingContext.canvas;
	if (!goatCanvas.day) {
		for (const k of ['day', 'night']) {
			goatCanvas[k] = document.createElement('canvas');
			goatCanvas[k].width = src.width;
			goatCanvas[k].height = src.height;
		}
	}
	if (goatCanvas.key === key) return goatCanvas;

	dg.clearRect(0, 0, src.width, src.height);

	ng.fillStyle = hsla(T.h, T.s, T.l, T.a);

	const apart = 1 - t;

		g.globalAlpha = 1;
		g.drawImage(dayImg, 0, 0);

	// at a third.
	drawSkyBody(g, scene.sun, constrain(n / 0.66, 0, 1));
	drawSkyBody(g, scene.moon, 1 - constrain((n - 0.34) / 0.66, 0, 1));

// Coalesced to one composite a frame.
let scrollFramePending = false;
function setScrollPos(pos) {
	if (!scene) return;
	scrollPos = constrain(pos, 0, 1);
	if (!scrollFramePending) {
		scrollFramePending = true;
		requestAnimationFrame(() => {
			scrollFramePending = false;
			composite();
		});

function mouseWheel(event) {
	setScrollPos(scrollPos + event.delta * SCROLL.speed);
	return false;
}

// Touch: a vertical drag anywhere on the page is the scroll. Dragging up runs
// toward night, as a swipe scrolls a phone page down; SCROLL.touchSweep of the
// window's height takes it end to end. Listened for on the window, not the
// canvas, so a drag in the margin around the frame works too.
let touchY = null;
window.addEventListener('touchstart', (e) => {
	if (e.touches.length === 1) touchY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchmove', (e) => {
	if (touchY === null || e.touches.length !== 1) return;
	e.preventDefault();
	const y = e.touches[0].clientY;
	setScrollPos(scrollPos + (touchY - y) / (window.innerHeight * SCROLL.touchSweep));
	touchY = y;

const endTouch = () => { touchY = null; };
window.addEventListener('touchend', endTouch);
window.addEventListener('touchcancel', endTouch);

// ---------------------------------------------------------------------------
// The room: scene 44's smile and range, same rolls and same rules.
// ---------------------------------------------------------------------------

const SEAM_SEGMENTS = 120;

function buildRoom() {
	const W = width, H = height;
	const cx = W * 0.5 + random(-1, 1) * W * 0.02;
	const cy = H * random(0.72, 0.84);

	const SMILE_RISE = random(0.12, 0.26);
	const SMILE_POWER = random(2, 3);
	const angleRoll = random(-1, 1);
	const SMILE_ANGLE = (angleRoll < 0 ? -1 : 1) * (4 + Math.abs(angleRoll) * 3);
	const lean = Math.tan(SMILE_ANGLE * PI / 180);
	const ENDS_MIN_Y = H * 0.22;
	const leanLift = Math.abs(lean) * Math.max(cx, W - cx);
	const rise = Math.max(0, Math.min(H * SMILE_RISE, cy - ENDS_MIN_Y - leanLift));

	const seamAmp = random(1.2, 3.0) * 2;
	const seamPhase = random(0, TWO_PI);
	const seamWaves = random(0.6, 2.2);
	const seamWobble = (u) =>
		sin(seamPhase + u * TWO_PI * seamWaves) * seamAmp
		+ sin(seamPhase * 1.7 + u * TWO_PI * seamWaves * 2.3) * seamAmp * 0.3;
	const seamYAt = (x) => {
		const u = x < cx ? (x - cx) / cx : (x - cx) / (W - cx);
		return cy - rise * Math.pow(Math.abs(u), SMILE_POWER) + lean * (x - cx);
	};

	const seam = [];
	for (let i = 0; i <= SEAM_SEGMENTS; i++) {
		const u = i / SEAM_SEGMENTS;
		seam.push({ x: W * u, y: seamYAt(W * u) + seamWobble(u) });
	}

	// All RIDGE_LIMIT sets of rolls always taken, so ?ridges= adds a ridge behind
	// rather than redrawing the ones in front.
	const RIDGE_TOP_Y = H * 0.1;
	const rolls = [];
	for (let k = 0; k < RIDGE_LIMIT; k++) {
		const endsRoll = random(0.25, 0.6);
		rolls.push({
			peak: random(0.30, 0.58),
			crest: random(0.18, 0.82),
			power: random(0.8, 1.6),
			phase: random(-TWO_PI, TWO_PI),
			waves: random(0.7, 2.4),
			wobbleAmp: random(1.5, 3.5),
			ends: k === 0 ? 0 : endsRoll,
		});
	}

	const ridges = [];
	const ridgeCrests = [];
	for (let k = 0; k < ridgeCount; k++) {
		const r = rolls[k];
		const below = k === 0 ? seam : ridges[k - 1];
		const crestX = W * r.crest;
		const crestRise = Math.max(0, yOn(below, crestX) - RIDGE_TOP_Y) * r.peak;
		const envelopeAt = (x) => {
			const v = x < crestX
				? (x - crestX) / Math.max(1, crestX)
				: (x - crestX) / Math.max(1, W - crestX);
			return r.ends + (1 - r.ends) * (1 - Math.pow(Math.min(1, Math.abs(v)), r.power));
		};
		const wobbleAt = (u) => (
			sin(r.phase + u * TWO_PI * r.waves)
			+ sin(r.phase * 1.7 + u * TWO_PI * r.waves * 2.3) * 0.3
		) * seamAmp * r.wobbleAmp;
		const bumpAt = (x) => Math.max(0, (crestRise + wobbleAt(x / W)) * envelopeAt(x));
		ridges.push(below.map(p => ({ x: p.x, y: p.y - bumpAt(p.x) })));
		ridgeCrests.push(crestX);
	}

	const last = ridges.length ? ridges[ridges.length - 1] : seam;
	return {
		seam,
		ridges,
		ridgeCrests,
		grassPoly: [...seam, { x: W, y: H }, { x: 0, y: H }],
		skyPoly: [...last.slice().reverse(), { x: 0, y: 0 }, { x: W, y: 0 }],
	};
}

// Height of a sampled curve at x (every curve shares the seam's x samples).
function yOn(pts, x) {
	const t = Math.max(0, Math.min(SEAM_SEGMENTS, (x / width) * SEAM_SEGMENTS));
	const i = Math.min(SEAM_SEGMENTS - 1, Math.floor(t));
	return pts[i].y + (pts[i + 1].y - pts[i].y) * (t - i);
}

// ---------------------------------------------------------------------------
// Surface shading
// ---------------------------------------------------------------------------

function hsla(h, s, l, a) {
	return `hsla(${((h % 360) + 360) % 360},${constrain(s, 0, 100)}%,${constrain(l, 0, 100)}%,${a})`;
}

function withClip(poly, fn) {
	const g = drawingContext;
	g.save();
	g.beginPath();
	g.moveTo(poly[0].x, poly[0].y);
	for (let i = 1; i < poly.length; i++) g.lineTo(poly[i].x, poly[i].y);
	g.closePath();
	g.clip();
	fn(g);
	g.restore();
}

// Grass: a green gradient that starts in the sky's own colour at the seam and
// deepens to saturated green at the bottom of the frame.
function drawGrass(poly, seam) {
	const H = height;
	// One gradient per thin column, running from the seam at that x down to the
	// bottom of the frame, so the fade follows the curve. It starts at exactly
	// the sky's colour where it touches the seam, passes through the palette's
	// haze, and only reaches full green near the viewer — the field dissolves
	// into the sky rather than stopping at it.
	const skyBottom = Math.max(...seam.map(p => p.y));
	const haze = hazeColor();
	const COL = 3;
	// Not clipped: each column starts a few px above the seam in the sky's own
	// colour, so it covers the seam's anti-aliased edge — clipped, the black
	// canvas under both surfaces showed through it as a hairline.
	const g = drawingContext;
	for (let x = 0; x < width; x += COL) {
		const y0 = yOn(seam, x + COL * 0.5);
		const sky = skyColorAt(y0, skyBottom);
		const grad = g.createLinearGradient(0, y0, 0, H);
		grad.addColorStop(0, hsla(sky.h, sky.s, sky.l, 1));
		grad.addColorStop(0.18, hsla(haze.h, haze.s, haze.l, 1));
		for (const [t, h, s, l] of PAL.grass) grad.addColorStop(t, hsla(h, s, l, 1));
		g.fillStyle = grad;
		g.fillRect(x, y0 - 4, COL + 1, H - y0 + 4);
	}
}

// The haze the grass passes through. By day it takes its hue and saturation
// from a colour of the goats' palette (see pickGoatPalette), at the palette
// haze's lightness, so the glow over the field changes with the palette; the
// pick is on a stream of its own and prefers a coloured swatch over a grey.
// Night keeps its own.
function hazeColor() {
	if (PAL !== PALETTES.day) return PAL.haze;
	if (!goatPalette) goatPalette = pickGoatPalette();
	const coloured = goatPalette.filter((c) => c.s > 30);
	const pool = coloured.length ? coloured : goatPalette;
	const c = pool[new FinishRng(goatSeed * 23 + 11).int(0, pool.length - 1)];
	return { h: c.h, s: Math.max(c.s, 60), l: PAL.haze.l };
}

// A ridge band: brown earth hatched with the engine's surface shading, and
// the flank turned from the light darker. Further ridges are paler and greyer
// — the aerial perspective scene 44 gives its wedges.
function drawRidgeBand(ridge, below, crestX, k, total) {
	const poly = [...ridge, ...below.slice().reverse()];
	const far = total <= 1 ? 0 : k / (total - 1);
	const hue = lerp(26, 30, far);
	const sat = lerp(48, 22, far);
	const lightTop = lerp(52, 72, far);
	const lightBase = lerp(26, 52, far);
	const topY = Math.min(...ridge.map(p => p.y));
	const botY = Math.max(...below.map(p => p.y));

	withClip(poly, (g) => {
		const grad = g.createLinearGradient(0, topY, 0, botY);
		grad.addColorStop(0, hsla(hue, sat, lightTop, 1));
		grad.addColorStop(1, hsla(hue - 6, sat + 6, lightBase, 1));
		g.fillStyle = grad;
		g.fillRect(0, topY - 2, width, botY - topY + 4);
	});

	// Surface shading: the engine's wall hatch, in the band's own browns. Not
	// clipped, so it wanders past the band's edges the way an unmasked wall's
	// does; the nearer bands and the grass, drawn after, cover what spills down.
	drawSurfaceShading(poly, { h: hue, hRange: 10, s: sat, lMin: lightBase, lMax: lightTop }, k);

	withClip(poly, (g) => {
		// Shadow flank: a soft wash over the side turned away from the light.
		const shadowSide = LIGHT_FROM_LEFT ? 1 : -1;
		const sg = g.createLinearGradient(crestX - width * 0.06, 0, crestX + shadowSide * width * 0.35, 0);
		sg.addColorStop(0, hsla(hue, sat, 10, 0));
		sg.addColorStop(1, hsla(hue + 4, sat, 12, lerp(0.32, 0.16, far)));
		g.fillStyle = sg;
		g.fillRect(0, topY - 2, width, botY - topY + 4);
	});
}

// The sky gradient's colour at height y, for a sky whose gradient runs from
// the top of the frame to `bottom` — the stops drawSky lays down.
function skyColorAt(y, bottom) {
	const stops = PAL.sky;
	const t = constrain(y / Math.max(1, bottom), 0, 1);
	for (let i = 1; i < stops.length; i++) {
		if (t <= stops[i][0]) {
			const f = (t - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
			return {
				h: lerp(stops[i - 1][1], stops[i][1], f),
				s: lerp(stops[i - 1][2], stops[i][2], f),
				l: lerp(stops[i - 1][3], stops[i][3], f),
			};
		}
	}
	const last = stops[stops.length - 1];
	return { h: last[1], s: last[2], l: last[3] };
}

// Sky: the palette's gradient, top of the frame down to the horizon.
function drawSky(poly, lastRidge) {
	const botY = Math.max(...lastRidge.map(p => p.y));
	withClip(poly, (g) => {
		const grad = g.createLinearGradient(0, 0, 0, botY);
		for (const [t, h, s, l] of PAL.sky) grad.addColorStop(t, hsla(h, s, l, 1));
		g.fillStyle = grad;
		g.fillRect(0, 0, width, botY + 2);
	});
}

// ---------------------------------------------------------------------------
// Finishing: applyTexture, applyTexture2 and applyGrain from src/jinsei.js,
// verbatim. Around them, the few engine names they read: `rng` (a seeded
// stream with the engine's decimal()), `scaleFactor`, the EFFECTS strengths
// they paint at, and textureLayerColor — whose S/L bands are the engine's
// (TEXTURE_BANDS in src/jinsei_texture.js); the hue there follows the line
// palette, which this page does not have, so it is rolled.
// ---------------------------------------------------------------------------

class FinishRng {
	int(a, b) { return Math.floor(this.decimal(a, b + 1)); }
	bool(p = 0.5) { return this.next() < p; }
	constructor(seed) { this.s = (seed * 2654435761 + 0x9e3779b9) >>> 0; }
	next() {
		let t = (this.s = (this.s + 0x6d2b79f5) >>> 0);
		t = Math.imul(t ^ (t >>> 15), t | 1);
		t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	}
	decimal(a, b) {
		if (a === undefined) return this.next();
		return a + this.next() * (b - a);
	}
}
let rng = null;
// The engine's scaleFactor is 1 at its 1969px-wide canvas; the textures and
// the surface hatch read their sizes in its pixels.
const scaleFactor = CANVAS_WIDTH / 1969;
const EFFECTS = { grain: 0.3, texDodge: 0.35, texBurn: 0.35 };
const FINISH_COLOR_LIMITS = {
	texA: { s: [20, 50], l: [50, 65] },
	texB: { s: [20, 40], l: [50, 70] },
};

function textureLayerColor(key) {
	const lim = FINISH_COLOR_LIMITS[key];
	return {
		h: rng.decimal(0, 360),
		s: rng.decimal(lim.s[0], lim.s[1]),
		l: rng.decimal(lim.l[0], lim.l[1])
	};
}

function applyGrain() {
	loadPixels();
	const grainAmt = 50 * EFFECTS.grain;
	for (let i = 0; i < pixels.length; i += 4) {
		const grain = rng.decimal(-grainAmt, grainAmt);
		pixels[i] = constrain(pixels[i] + grain, 0, 255);
		pixels[i + 1] = constrain(pixels[i + 1] + grain, 0, 255);
		pixels[i + 2] = constrain(pixels[i + 2] + grain, 0, 255);
	}
	updatePixels();
}

function applyTexture() {
	const texCol = textureLayerColor('texA');
	noStroke();
	fill(texCol.h, texCol.s, texCol.l, 1 * EFFECTS.texDodge);

	let texSpacing = 6 * scaleFactor;
	for (let x = 0; x < width; x += texSpacing) {
		texSpacing = rng.decimal(6, 7) * scaleFactor;
		for (let y = 0; y < height; y += texSpacing) {
			let noiseVal = rng.decimal(0, 5);
			if (noiseVal < .01) {
				blendMode(BURN);
			} else if (noiseVal < .06) {
				blendMode(SCREEN);
			} else {
				blendMode(DODGE);
			}
			const offsetX = rng.decimal(-0.3, 0.3) * scaleFactor;
			const offsetY = rng.decimal(-0.3, 0.3) * scaleFactor;
			const size = (1 + rng.decimal(-1, .5)) * scaleFactor;
			const size2 = (1 + rng.decimal(-1, .5)) * scaleFactor;
			rect(x + offsetX, y + offsetY, size, size2);
		}
	}
	blendMode(BLEND);
}

function applyTexture2() {
	const texCol = textureLayerColor('texB');
	blendMode(BURN);
	noStroke();
	fill(texCol.h, texCol.s, texCol.l, EFFECTS.texBurn);

	let texSpacing = 6 * scaleFactor;
	for (let x = 0; x < width; x += texSpacing) {
		texSpacing = rng.decimal(4, 6) * scaleFactor;
		for (let y = 0; y < height; y += texSpacing) {
			const offsetX = rng.decimal(-0.3, 0.3) * scaleFactor;
			const offsetY = rng.decimal(-0.3, 0.3) * scaleFactor;
			const size = (.3 + rng.decimal() * 0.15) * scaleFactor;
			const size2 = (.4 + rng.decimal() * 0.15) * scaleFactor;
			ellipse(x + offsetX, y + offsetY, size, size2);
		}
	}
	blendMode(BLEND);
}

// ---------------------------------------------------------------------------
// Surface shading: the panel's "Surface shading" switch in the engine, which is
// the hatch every wall gets — precomputeFaceStrokes and drawFaceStrokeItem from
// src/jinsei_texture.js, verbatim below (minus the room-clip and hidden-item
// plumbing this page has no use for). Five layers of scanline strokes at
// angles fanned across half a turn, each stroke drawn three times: a shadow
// copy offset down-right, the stroke, and a highlight up-left. Called with the
// options walls get (strokeWRange 0.1-0.7) and scene 44's wall light, 0.95.
// Unclipped, as the engine paints it with shadingSelfClipOn off.
//
// Each band hatches from a stream of its own, as the engine forks one for the
// fill pass, so nothing else in the piece moves.
// ---------------------------------------------------------------------------

const RIDGE_WALL_LIGHT = 0.95;

function drawSurfaceShading(vertices, strokeColor, bandIndex) {
	const saved = rng;
	rng = new FinishRng(sceneSeed * 7919 + bandIndex * 104729 + 17);
	const items = precomputeFaceStrokes(vertices, strokeColor, RIDGE_WALL_LIGHT, { strokeWRange: [0.1, 0.7] });
	rng = saved;
	push();
	colorMode(HSL, 360, 100, 100, 1);
	blendMode(BLEND);
	for (const item of items) drawFaceStrokeItem(item);
	pop();
}

function _getVertexFns(vertexMode, mixChance) {
	if (vertexMode === 0) {
		return {
			first: (x, y) => vertex(x, y),
			mid:   (x, y) => vertex(x, y),
			last:  (x, y) => vertex(x, y)
		};
	} else if (vertexMode === 1) {
		return {
			first: (x, y) => { curveVertex(x, y); curveVertex(x, y); },
			mid:   (x, y) => curveVertex(x, y),
			last:  (x, y) => { curveVertex(x, y); curveVertex(x, y); }
		};
	} else {
		return {
			first: (x, y) => { curveVertex(x, y); curveVertex(x, y); },
			mid:   (x, y) => { if (Math.random() < mixChance) vertex(x, y); else curveVertex(x, y); },
			last:  (x, y) => { curveVertex(x, y); curveVertex(x, y); }
		};
	}
}

function precomputeFaceStrokes(vertices, strokeColor, lightMult = 1.0, opts = {}) {
	const strokes = [];
	const strokeWRange = opts.strokeWRange || [0.1, 0.2];
	const wobbleMax = 150;

	let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
	for (const v of vertices) {
		minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
		minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
	}

	function getLinePolygonIntersections(lineStartX, lineStartY, lineEndX, lineEndY) {
		const intersections = [];
		for (let i = 0, j = vertices.length - 1; i < vertices.length; j = i++) {
			const x1 = vertices[j].x, y1 = vertices[j].y;
			const x2 = vertices[i].x, y2 = vertices[i].y;
			const x3 = lineStartX, y3 = lineStartY;
			const x4 = lineEndX, y4 = lineEndY;

			const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
			if (Math.abs(denom) < 0.0001) continue;

			const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
			const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / denom;

			if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
				intersections.push({
					x: x1 + t * (x2 - x1),
					y: y1 + t * (y2 - y1),
					t: u
				});
			}
		}
		intersections.sort((a, b) => a.t - b.t);
		return intersections;
	}

	const diagLength = dist(minX, minY, maxX, maxY);
	const faceCX = (minX + maxX) / 2;
	const faceCY = (minY + maxY) / 2;
	const numLayers = 5;
	const layerStrokes = Array.from({ length: numLayers }, () => []);

	for (let layer = 0; layer < numLayers; layer++) {
		const baseAngle = rng.decimal(0, TWO_PI*8);
		const faceAngle = baseAngle + layer * (PI / numLayers) * .9;
		const perpAngle = faceAngle + HALF_PI;
		const spacing = rng.decimal(1.5, 10) * scaleFactor;

		for (let offset = -diagLength; offset < diagLength; offset += spacing) {
			if (rng.bool(0.05)) continue;

			const lineStartX = faceCX + cos(faceAngle) * (-diagLength) + cos(perpAngle) * offset;
			const lineStartY = faceCY + sin(faceAngle) * (-diagLength) + sin(perpAngle) * offset;
			const lineEndX = faceCX + cos(faceAngle) * diagLength + cos(perpAngle) * offset;
			const lineEndY = faceCY + sin(faceAngle) * diagLength + sin(perpAngle) * offset;

			const intersections = getLinePolygonIntersections(lineStartX, lineStartY, lineEndX, lineEndY);

			for (let seg = 0; seg < intersections.length - 1; seg += 2) {
				const p1 = intersections[seg];
				const p2 = intersections[seg + 1];
				if (!p2) continue;

				const segmentLength = dist(p1.x, p1.y, p2.x, p2.y);
				if (segmentLength < 3 * scaleFactor) continue;

				var numPoints = Math.max(1, Math.floor(segmentLength / (10 * scaleFactor)));
				const points = [];
				var continueB = rng.bool(0.5);
				for (let j = 0; j <= numPoints; j++) {
					let tempNumPoints = numPoints;
					if (rng.bool(0.4) && continueB) { continue; }
					const t = j / numPoints;
					const wobbleAmt = rng.decimal(-wobbleMax, wobbleMax) * scaleFactor;
					const wobble = rng.decimal(-wobbleAmt, wobbleAmt);
					const pX = -(p2.y - p1.y) / (segmentLength + 0.001);
					const pY = (p2.x - p1.x) / (segmentLength + 0.001);
					points.push({
						x: lerp(p1.x, p2.x, t) + pX * wobble,
						y: lerp(p1.y, p2.y, t) + pY * wobble
					});
					numPoints = tempNumPoints;
				}

				if (points.length < 2) continue;

				const h = strokeColor.h + rng.decimal(-strokeColor.hRange, strokeColor.hRange);
				const baseL = rng.decimal(strokeColor.lMin, strokeColor.lMax);
				const l = constrain(baseL * lightMult, 5, 95);
				const strokeW = rng.decimal(strokeWRange[0], strokeWRange[1]);
				const opacity = rng.decimal(0.9, 1.1);
				const baseDepth = 15 * scaleFactor;
				const vertexMode = rng.int(0, 2);
				let mixChance = 0;
				if (vertexMode === 2) {
					mixChance = rng.decimal(0.1, 0.3);
				}

				let accent = null;
				if (rng.bool(0.03)) {
					const segStart = Math.floor(rng.decimal(0, points.length * 0.7));
					const segEnd = Math.min(segStart + Math.floor(points.length * 0.2), points.length);
					accent = {
						segStart, segEnd,
						w: strokeW * scaleFactor * rng.decimal(.5, 2),
						opacity: rng.decimal(0.0, 0.4)
					};
				}

				layerStrokes[layer].push({
					points, h, s: strokeColor.s, l, strokeW, opacity, baseDepth, vertexMode, mixChance, accent
				});
			}
		}
	}

	let maxLayerCount = 0;
	for (let li = 0; li < layerStrokes.length; li++) {
		if (layerStrokes[li].length > maxLayerCount) maxLayerCount = layerStrokes[li].length;
	}
	for (let si = 0; si < maxLayerCount; si++) {
		for (let li = 0; li < layerStrokes.length; li++) {
			if (si < layerStrokes[li].length) {
				strokes.push(layerStrokes[li][si]);
			}
		}
	}

	return strokes;
}

function drawFaceStrokeItem(item) {
	const { points, h, s, l, strokeW, opacity, baseDepth, vertexMode, mixChance, accent } = item;
	const vFn = _getVertexFns(vertexMode, mixChance);

	strokeCap(ROUND);
	noFill();

	const useInvertedPasses = l < 35;
	const highlightL = useInvertedPasses ? max(l - 30, 5) : min(l + 30, 95);

	// 1. Shadow stroke (offset down-right)
	strokeWeight(strokeW * scaleFactor * 1.5);
	stroke(h, s * 1.5, l, opacity * 0.9);
	beginShape();
	for (let k = 0; k < points.length; k++) {
		const p = points[k];
		if (k === 0) vFn.first(p.x + baseDepth, p.y + baseDepth);
		else if (k === points.length - 1) vFn.last(p.x + baseDepth, p.y + baseDepth);
		else vFn.mid(p.x + baseDepth, p.y + baseDepth);
	}
	endShape();

	// 2. Main stroke
	strokeWeight(strokeW * scaleFactor);
	stroke(h, s, l, opacity);
	beginShape();
	for (let k = 0; k < points.length; k++) {
		if (k === 0) vFn.first(points[k].x, points[k].y);
		else if (k === points.length - 1) vFn.last(points[k].x, points[k].y);
		else vFn.mid(points[k].x, points[k].y);
	}
	endShape();

	// 3. Highlight stroke (offset up-left)
	strokeWeight(strokeW * scaleFactor * 0.5);
	stroke(h, s * 0.3, highlightL, opacity * 0.85);
	beginShape();
	for (let k = 0; k < points.length; k++) {
		const p = points[k];
		if (k === 0) vFn.first(p.x - baseDepth * 0.2, p.y - baseDepth * 0.2);
		else if (k === points.length - 1) vFn.last(p.x - baseDepth * 0.2, p.y - baseDepth * 0.2);
		else vFn.mid(p.x - baseDepth * 0.2, p.y - baseDepth * 0.2);
	}
	endShape();

	// Optional accent
	if (accent && accent.segEnd > accent.segStart) {
		strokeWeight(accent.w);
		stroke(0, 0, 5, accent.opacity);
		beginShape();
		for (let k = accent.segStart; k < accent.segEnd; k++) {
			if (k === accent.segStart) vFn.first(points[k].x, points[k].y);
			else if (k === accent.segEnd - 1) vFn.last(points[k].x, points[k].y);
			else vFn.mid(points[k].x, points[k].y);
		}
		endShape();
	}
}

// ---------------------------------------------------------------------------
// Ridge fold lines and the dotted horizon
// ---------------------------------------------------------------------------

function drawFoldLine(pts, hue, sat, light) {
	const g = drawingContext;
	g.save();
	g.lineCap = 'round';
	g.lineJoin = 'round';
	for (let pass = 0; pass < 3; pass++) {
		g.lineWidth = pass === 0 ? random(1.6, 2.6) : random(0.6, 1.4);
		g.strokeStyle = hsla(hue, sat, light + pass * 6, pass === 0 ? 0.55 : 0.25);
		const off = pass === 0 ? 0 : random(-2.5, 2.5);
		g.beginPath();
		for (let i = 0; i < pts.length; i++) {
			const p = pts[i];
			const y = p.y + off + (noise(p.x * 0.01, pass * 9) - 0.5) * 3;
			if (i === 0) g.moveTo(p.x, y); else g.lineTo(p.x, y);
		}
		g.stroke();
	}
	g.restore();
}

// The horizon drawn as a dusting of tiny white dots instead of a line: a few
// every step along the seam, scattered a little either side of it.
const DOT_LINE = {
	step: [3, 7],        // px between clusters along the seam
	perStep: [4, 8],     // dots in each cluster
	radius: [0.7, 1.8],  // px
	scatter: 10,         // px either side of the seam: the band's half-width
	alpha: [0.55, 1],
	// On the right the dots leave the seam and sag below it, like a ridge line
	// in front of the horizon. 0 up to dropFrom (a share of the width), easing
	// to `drop` (a share of the height) at the right edge; the left is untouched.
	dropFrom: 0.5,
	drop: 0.06,
	// The dots also fade out to the right: full strength up to fadeFrom (a
	// share of the width), nothing at the right edge.
	fadeFrom: 0.5,
	fadePower: 3,        // higher drops off faster just past fadeFrom
};

function drawDotLine(pts) {
	const r = new FinishRng(sceneSeed * 977 + 3);
	const g = drawingContext;
	const D = DOT_LINE;
	g.save();
	for (let x = 0; x < width; x += r.decimal(D.step[0], D.step[1])) {
		const n = r.int(D.perStep[0], D.perStep[1]);
		for (let i = 0; i < n; i++) {
			const dx = x + r.decimal(-2, 2);
			const u = constrain((dx / width - D.dropFrom) / (1 - D.dropFrom), 0, 1);
			const sag = height * D.drop * u * u * (3 - 2 * u);
			const dy = yOn(pts, dx) + sag + r.decimal(-D.scatter, D.scatter);
			const f = constrain((dx / width - D.fadeFrom) / (1 - D.fadeFrom), 0, 1);
			const fade = Math.pow(1 - f, D.fadePower);
			g.fillStyle = hsla(0, 0, 100, r.decimal(D.alpha[0], D.alpha[1]) * fade);
			g.beginPath();
			g.arc(dx, dy, r.decimal(D.radius[0], D.radius[1]), 0, TWO_PI);
			g.fill();
		}
	}
	g.restore();
}

// ---------------------------------------------------------------------------
// Goats
// ---------------------------------------------------------------------------

// The goat size the 3024x1564 frame gave (a quarter of its height), held as
// the frame went 4:3, so the goats keep their size against its width.
const BASE_GOAT_W = 1564 * 0.25 * 1.45; // 1.45: larger than that
const GOAT_ASPECT = 0.78;

// The weight of every drawn line on a goat — its own sketchy outlines (passed
// to drawGoat as lineWeight, 1 = the module's 0.35-0.85px) and the edge round
// the coat (drawGoatUnderpaint), which matches them.
const GOAT_LINE_WEIGHT = 3;

// How far each body part is shifted off the goat as a whole before you scroll
// (see `apart`), in the goat's own units (jinsei_goat.js's cubist
// displacement; its default is 0.2). The coat underneath is not shifted, so
// parts pushed out past it read as drawn over the ground.
const GOAT_JITTER = 0.1;

// The sketched edge round the coat, which sets the goats off from what is
// behind them.
const GOAT_CONTRAST = {
	passes: 4,           // overlapping sketchy passes
	wobble: 0.003,       // how far each pass strays, as a share of goat width
	alpha: [0.3, 0.9],
};

// How far below the goat's centre its hooves land, as a fraction of its height.
function goatFootFraction(pose) {
	const strokes = GOAT_POSES[pose] || GOAT_STROKES;
	const center = pose === 'eating' ? _goatCenterEating : _goatCenter;
	let maxY = 0;
	for (const s of strokes) for (const p of s.pts) if (p.t === 'a' && p.y > maxY) maxY = p.y;
	return maxY - center.y;
}

function placeGoats(room) {
	const H = height;
	const goats = [];
	const boxes = [];
	const fits = (box) => boxes.every(b =>
		box.x1 < b.x0 || box.x0 > b.x1 || box.y1 < b.y0 || box.y0 > b.y1);

	function tryPlace(make) {
		for (let attempt = 0; attempt < 80; attempt++) {
			const goat = make();
			if (!goat) continue;
			const halfW = goat.w * 0.5, gh = goat.h;
			const box = { x0: goat.footX - halfW, x1: goat.footX + halfW, y0: goat.footY - gh, y1: goat.footY };
			if (box.x0 < 0 || box.x1 > width || box.y1 > H * 0.985) continue;
			if (!fits(box)) continue;
			boxes.push(box);
			goats.push(goat);
			return true;
		}
		return false;
	}

	// In the grass: bigger toward the viewer.
	for (let n = 0; n < goatCount; n++) {
		tryPlace(() => {
			const x = random(width * 0.06, width * 0.94);
			const seamY = yOn(room.seam, x);
			const t = random(0.18, 0.9);
			const footY = lerp(seamY, H, t);
			const scale = lerp(0.5, 1.15, t) * random(0.92, 1.08);
			const w = BASE_GOAT_W * scale;
			return {
				footX: x, footY, w, h: w * GOAT_ASPECT,
				angle: random(-0.04, 0.04),
				pose: random() < 0.45 ? 'eating' : 'standing',
				flip: random() < 0.5,
				coat: PALETTES.day.coats[floor(random(PALETTES.day.coats.length))],
				shadow: PALETTES.day.shadow,
			};
		});
	}
	return goats;
}

// The colour each of a goat's pieces is filled with: a colour from one of
// SKY MEADOW's palettes (sky_meadow_palettes.js), the same palette for the
// whole herd. The palette is rolled from the goat seed and logged with it;
// ?goatpal= pins one by name ("Farmville") or index. Each piece's pick is
// rolled from its own stream keyed by the goat and the piece, so it moves
// nothing else and a ?goatseed= always comes back the same colours.
const GOAT_PIECE_ALPHA = 1;
let goatPalette = null;

function pickGoatPalette() {
	const list = SKY_MEADOW_PALETTES;
	const asked = new URLSearchParams(window.location.search).get('goatpal');
	let pal = null;
	if (asked !== null) {
		pal = list.find((p) => p.name.toLowerCase() === asked.toLowerCase()) || list[Number(asked)] || null;
	}
	if (!pal) pal = list[new FinishRng(goatSeed * 13 + 3).int(0, list.length - 1)];
	console.log('goat palette', pal.name);
	return pal.c.map(hexToHsl);
}

function hexToHsl(hex) {
	const n = parseInt(hex.slice(1), 16);
	const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
	const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
	let h = 0, s = 0;
	if (d > 0) {
		s = d / (1 - Math.abs(2 * l - 1));
		if (mx === r) h = ((g - b) / d) % 6;
		else if (mx === g) h = (b - r) / d + 2;
		else h = (r - g) / d + 4;
		h = (h * 60 + 360) % 360;
	}
	return { h, s: s * 100, l: l * 100 };
}

function goatPieceColor(i, si) {
	if (!goatPalette) goatPalette = pickGoatPalette();
	const r = new FinishRng(goatSeed * 17 + i * 7919 + si * 131 + 5);
	const c = goatPalette[r.int(0, goatPalette.length - 1)];
	return { h: c.h, s: c.s, l: c.l, a: GOAT_PIECE_ALPHA };
}

// phase 'base': the contact shadow and the coat under the goat.
// phase 'parts': the goat's own drawing, every part at home, reporting each
// part through onPart (see jinsei_goat.js's jitterHome).
function drawPlacedGoat(goat, i, phase, onPart) {
	const footFrac = goatFootFraction(goat.pose);
	const cx = goat.footX - Math.sin(goat.angle) * footFrac * goat.h;
	const cy = goat.footY - Math.cos(goat.angle) * footFrac * goat.h;
	const g = drawingContext;

	if (phase === 'base') {
		// Contact shadow, thrown away from the light: the same soft ellipse it
		// always was — darkest under the feet, fading to nothing at the rim — but
		// drawn as close horizontal lines instead of a smooth fill. Each line is
		// the ellipse's exact chord at that height, and carries the radial fade
		// along its length.
		g.save();
		const sx = goat.footX + goat.w * 0.08;
		const rx = goat.w * 0.5, ry = goat.w * 0.07;
		const gap = Math.max(2, goat.w * 0.008);
		const sh = goat.shadow;
		for (let dy = -ry + gap * 0.5; dy < ry; dy += gap) {
			const v = Math.abs(dy) / ry;
			const span = rx * Math.sqrt(1 - v * v);
			if (span < 1) continue;
			const y = goat.footY + dy;
			const line = g.createLinearGradient(sx - span, 0, sx + span, 0);
			line.addColorStop(0, hsla(sh.hue, sh.sat, sh.light, 0));
			line.addColorStop(0.5, hsla(sh.hue, sh.sat, sh.light, 0.5 * (1 - v)));
			line.addColorStop(1, hsla(sh.hue, sh.sat, sh.light, 0));
			g.strokeStyle = line;
			g.lineWidth = gap * 0.5;
			g.beginPath();
			g.moveTo(sx - span, y);
			g.lineTo(sx + span, y);
			g.stroke();
		}
		g.restore();
	}

	push();
	if (goat.flip) {
		translate(cx, 0);
		scale(-1, 1);
		translate(-cx, 0);
	}
	const angle = goat.flip ? -goat.angle : goat.angle;
	if (phase === 'base') {
		drawGoatUnderpaint(cx, cy, goat.w, goat.h, angle, goat.pose, goat.coat);
	} else {
		drawGoat(cx, cy, goat.w, goat.h, angle, {
			seed: goatSeed + i * 101,
			pose: goat.pose,
			jitter: GOAT_JITTER,
			jitterHome: true,
			onPart,
			partFill: (si) => goatPieceColor(i, si),
			blendMode: BLEND,
			palette: goat.coat,
			lineWeight: GOAT_LINE_WEIGHT,
		});
	}
	pop();
}

// _SILHOUETTE_ORDER traces the standing goat; the eating goat names its front
// legs and jaw differently and has a chest, so it gets its own walk round the
// outline — top line to the face, down the chest, legs, belly, tail.
const SILHOUETTE_ORDER_EATING = [
	['back', false], ['right_jaw', false], ['head', true], ['chest', true],
	['front_leg_left_front', true], ['front_leg_left_hoof', false], ['front_leg_left_back', true],
	['front_leg_right_front', true], ['front_leg_right_hoof', false], ['front_leg_right_back', true],
	['belly', true],
	['hind_leg_left_front', true], ['hind_leg_left_hoof', false], ['hind_leg_left_back', true],
	['hind_leg_right_front', true], ['hind_leg_right_hoof', false], ['hind_leg_right_back', true],
	['tail', false],
];

// The goat's hatch is open and partial, so on grass and earth the ground
// would show straight through it. A pale coat under the silhouette, in the
// goat's own tone, keeps it standing in front of the surface it is on.
function drawGoatUnderpaint(x, y, w, h, angle, pose, coat) {
	const strokes = GOAT_POSES[pose] || GOAT_STROKES;
	const center = pose === 'eating' ? _goatCenterEating : _goatCenter;
	const cosA = Math.cos(angle), sinA = Math.sin(angle);
	const xform = (nx, ny) => {
		const lx = (nx - center.x) * w;
		const ly = (ny - center.y) * h;
		return { x: x + lx * cosA - ly * sinA, y: y + lx * sinA + ly * cosA };
	};
	const map = {};
	for (const s of strokes) map[s.name] = s;
	const g = drawingContext;

	// The body: the silhouette trace.
	const bodyPts = [];
	for (const [name, rev] of pose === 'eating' ? SILHOUETTE_ORDER_EATING : _SILHOUETTE_ORDER) {
		const s = map[name];
		if (!s) continue;
		const poly = _strokeToPoly(s.pts, xform, 6);
		if (rev) poly.reverse();
		bodyPts.push(...poly);
	}

	// The face. The silhouette trace crosses itself there and leaves a hole, so
	// the head's own outline is filled as well, as one convex shape — a path of
	// its own, since added to the body its winding cancelled the hole's.
	let facePts = null;
	const hull = [];
	for (const name of ['head', 'left_jaw', 'right_jaw', 'nostril_right', 'eye_right']) {
		const st = map[name];
		if (st) hull.push(..._strokeToPoly(st.pts, xform, 6));
	}
	if (hull.length > 2) {
		hull.sort((a, b) => a.x - b.x || a.y - b.y);
		const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
		const lo = [], hi = [];
		for (const p of hull) {
			while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop();
			lo.push(p);
		}
		for (let i = hull.length - 1; i >= 0; i--) {
			const p = hull[i];
			while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop();
			hi.push(p);
		}
		facePts = lo.slice(0, -1).concat(hi.slice(0, -1));
	}
	const pathOf = (pts, jit) => {
		const path = new Path2D();
		pts.forEach((p, i) => {
			const x = p.x + (jit ? random(-jit, jit) : 0), y = p.y + (jit ? random(-jit, jit) : 0);
			if (i === 0) path.moveTo(x, y); else path.lineTo(x, y);
		});
		path.closePath();
		return path;
	};
	const shapes = facePts ? [bodyPts, facePts] : [bodyPts];

	const C = GOAT_CONTRAST;
	g.save();
	g.lineJoin = 'round';
	// The edge, in the goat's own hand: a few wobbly passes in the dark pencil
	// jinsei_goat.js outlines its parts with (hue 35, sat 12), each a little
	// wider or narrower than the last, laid down first. The coat filled over
	// them hides their inner half and every line the trace draws across the
	// inside, so what is left is a sketched edge round the outside.
	g.lineCap = 'round';
	for (let pass = 0; pass < C.passes; pass++) {
		g.strokeStyle = hsla(35, 12, random(18, 34), random(C.alpha[0], C.alpha[1]));
		// Doubled because the coat covers the inner half: what shows is the
		// goat's own outline weight (0.35-0.85px x GOAT_LINE_WEIGHT).
		g.lineWidth = 2 * random(0.35, 0.85) * GOAT_LINE_WEIGHT;
		for (const pts of shapes) g.stroke(pathOf(pts, w * C.wobble));
	}
	// The coat, opaque, so the ground does not show through.
	const sw = coat.swatches[0];
	const l = (sw.lMin + sw.lMax) * 0.5;
	g.fillStyle = hsla(sw.h, sw.s, l, 1);
	for (const pts of shapes) g.fill(pathOf(pts, 0));
	g.restore();
}

function readIntFromUrl(name, fallback, lo, hi) {
	const q = new URLSearchParams(window.location.search);
	if (!q.has(name)) return fallback;
	const value = Number(q.get(name));
	if (!Number.isFinite(value)) return fallback;
	return Math.max(lo, Math.min(hi, Math.floor(Math.abs(value))));
}
